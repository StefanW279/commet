[package]
name = "rust_lib_commet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
base64 = "0.23.1"
bytes = "1.11.1"
flutter_rust_bridge = "=2.13.0"
hex = "0.4.3"
image = "0.25.10"
lazy_static = "1.5.0"
log = "0.4.29"
once_cell = "1.21.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
stderrlog = "0.6.0"
tao = "0.35.3"
tokio = { version = "1.50.0", features = ["io-util", "io-std"] }
uuid = "1.23.0"
wry = "0.55.1"
overlay = { git = "https://github.com/commetchat/overlay.git", rev = "5e110888725bc2e21831b923896f2f89dea5963f" }

[target.'cfg(unix)'.dependencies]
webrtc = "0.21.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
