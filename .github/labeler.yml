# Automatically applied to pull requests based on changed paths.
# Labels are created automatically by the workflow if they do not exist.
area/commet:
  - changed-files:
      - any-glob-to-any-file:
          - "commet/**"

area/tiamat:
  - changed-files:
      - any-glob-to-any-file:
          - "tiamat/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

build:
  - changed-files:
      - any-glob-to-any-file:
          - "commet/buildscripts/**"
          - "**/Dockerfile"
          - "**/Dockerfile.*"
          - "**/*.gradle"
          - "**/*.gradle.kts"
          - "**/CMakeLists.txt"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/pubspec.lock"
          - "**/package-lock.json"
          - "**/pnpm-lock.yaml"
          - "**/yarn.lock"
          - "**/Cargo.lock"
