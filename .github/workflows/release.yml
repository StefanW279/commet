
name: release
on:
  release:
    types:
      - created
  workflow_dispatch:

env:
  PROJECT_PATH: commet
  COMMET_PROD: 1

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'true'
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Configure Flutter
        run: flutter config --enable-windows-desktop
        
      - name: Code Generation
        run: |
          cd .\commet
          git config --global core.longpaths true
          dart run scripts/codegen.dart

      - name: Build Windows App
        run: |
          cd .\commet
          dart run scripts/build_release.dart --platform windows --version_tag ${{ github.event.release.tag_name || 'v0.0.0-artifact' }} --git_hash ${{ github.sha }}

      - name: Archive 
        run: tar -a -c -f commet-windows.zip -C .\commet\build\windows\x64\runner\ Release
      
      - name: Upload ZIP to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: .\commet-windows.zip
          asset_name: commet-windows.zip
          asset_content_type: application/zip
      
      - name: Upload Zip Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: commet-windows.zip
          path: .\commet-windows.zip
          overwrite: true

      - name: Calculate MSI Version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v0.0.0.0"
          }

          if ($tag -notmatch '^v?(\d+)\.(\d+)\.(\d+)\.(\d+)$') {
            throw "Invalid release tag '$tag'. Expected a four-part version such as v0.5.0.11."
          }

          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $build = [int]$Matches[3]
          $revision = [int]$Matches[4]

          if ($major -gt 255 -or $minor -gt 255) {
            throw "MSI major and minor versions must each be 255 or lower."
          }

          if ($revision -gt 999) {
            throw "Revision must be between 0 and 999."
          }

          $msiBuild = $build * 1000 + $revision

          if ($msiBuild -gt 65535) {
            throw "Encoded MSI build number exceeds 65535."
          }

          $msiVersion = "$major.$minor.$msiBuild"
          "MSI_VERSION=$msiVersion" >> $env:GITHUB_ENV

          Write-Host "Git tag: $tag"
          Write-Host "MSI version: $msiVersion"

      - name: Generate WiX File Components
        shell: pwsh
        run: |
          $releaseDir = (Resolve-Path ".\commet\build\windows\x64\runner\Release").Path
          $installerDir = ".\commet\windows\installer"
          $generator = Join-Path $installerDir "GenerateFiles.ps1"
          $generated = Join-Path $installerDir "GeneratedFiles.wxs"

          if (-not (Test-Path $generator)) {
            throw "WiX generator not found: $generator"
          }

          & $generator -SourceDir $releaseDir -OutputFile $generated

          if (-not (Test-Path $generated)) {
            throw "GeneratedFiles.wxs was not created."
          }

      - name: Build MSI Installer
        shell: pwsh
        run: |
          $project = ".\commet\windows\installer\Installer.wixproj"
          $installerDir = ".\commet\windows\installer"

          # Avoid accidentally collecting an MSI from an earlier build.
          if (Test-Path (Join-Path $installerDir "bin")) {
            Remove-Item (Join-Path $installerDir "bin") -Recurse -Force
          }

          dotnet build $project `
            --configuration Release `
            "-p:ProductVersion=$env:MSI_VERSION"

          $msiPath = ".\commet\windows\installer\bin\x64\Release\commet-windows.msi"

          if (-not (Test-Path $msiPath)) {
            throw "MSI was not created at expected path: $msiPath"
          }

          Copy-Item $msiPath ".\commet-windows.msi" -Force

      - name: Validate MSI contents
        shell: pwsh
        run: |
          $msiPath = (Resolve-Path ".\\commet-windows.msi").Path
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msiPath, 0)
          $view = $database.OpenView('SELECT `FileName` FROM `File`')
          $view.Execute()

          $fileCount = 0
          $hasApplication = $false
          while ($record = $view.Fetch()) {
            $fileCount++
            $fileName = [string]$record.StringData(1)
            if ($fileName -match '(?i)commet\.exe$') {
              $hasApplication = $true
            }
          }
          $view.Close()

          Write-Host "MSI File table entries: $fileCount"
          if ($fileCount -eq 0) {
            throw "The MSI File table is empty; refusing to publish an installer with no payload files."
          }
          if (-not $hasApplication) {
            throw "The MSI does not contain commet.exe; refusing to publish an incomplete installer."
          }

      - name: Upload MSI Artifact
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: .\commet-windows.msi
          asset_name: commet-windows.msi
          asset_content_type: application/x-msi

      - name: Upload MSI Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: commet-windows.msi
          path: .\commet-windows.msi
          overwrite: true
