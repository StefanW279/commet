# to fix failure of this workflow run the following command from the 'commet' directory, then commit any files that got changed: 'dart format .'
name: static-analysis
on:
  pull_request:
  merge_group:

env:
  PROJECT_PATH: commet

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'true'
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Bypass degraded Ubuntu mirror
        run: |
          grep -Eq '^https://archive\.ubuntu\.com/ubuntu/([[:space:]]|$)' /etc/apt/apt-mirrors.txt
          sudo sed -i -E '\@^https?://azure\.archive\.ubuntu\.com/ubuntu/([[:space:]]|$)@d' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt

      - name: Setup Tools
        timeout-minutes: 5
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv libmimalloc-dev

      - name: Configure Flutter
        run: flutter config --enable-linux-desktop

      - name: Check Code Style
        run: |
          cd $PROJECT_PATH
          flutter doctor
          flutter pub get
          rm -r lib/generated
          dart format -o none --show all --set-exit-if-changed .
        
      - name: Code Generation
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart

      - name: Check Warnings
        run: |
          cd $PROJECT_PATH
          dart analyze
