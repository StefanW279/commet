name: Pull Request Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Do not check out or execute pull-request code in this privileged workflow.
      - name: Apply labels
        uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
