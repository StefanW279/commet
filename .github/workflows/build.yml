
name: build

on:
  pull_request_target:
    types: 
      - opened
      - synchronize
      - reopened
    branches:
      - main
  merge_group:
  workflow_dispatch:

env:
  PROJECT_PATH: commet


permissions:
  contents: read
  id-token: none
  actions: none
  artifact-metadata: none
  attestations: none
  checks: none
  code-quality: none
  deployments: none
  issues: none
  discussions: none
  packages: none
  pages: none
  pull-requests: read
  security-events: none
  statuses: none
  vulnerability-alerts: none

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Configure Flutter
        run: flutter config --enable-windows-desktop
        
      - name: Code Generation
        run: |
          cd .\commet
          git config --global core.longpaths true
          dart run scripts/codegen.dart

      - name: Build Windows App
        run: |
          cd .\commet
          dart run scripts/build_release.dart --platform windows --version_tag 'v0.0.0-artifact' --git_hash ${{ github.sha }}

      - name: Archive 
        run: tar -a -c -f commet-windows.zip -C .\commet\build\windows\x64\runner\ Release

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: commet-windows.zip
          path: |
            .\commet-windows.zip
          retention-days: 1
          overwrite: true

      - name: Checkout installer files from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: installer-source
          sparse-checkout: |
            commet/windows/installer
          sparse-checkout-cone-mode: true

      - name: Copy installer files into original location
        shell: pwsh
        run: |
          $source = ".\installer-source\commet\windows\installer"
          $destination = ".\commet\windows\installer"

          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item "$source\*" $destination -Recurse -Force

      - name: Calculate MSI Version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v0.0.0.0"
          }

          if ($tag -notmatch '^v?(\d+)\.(\d+)\.(\d+)\.(\d+)$') {
            throw "Invalid release tag '$tag'. Expected a four-part version such as v0.5.0.11."
          }

          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $build = [int]$Matches[3]
          $revision = [int]$Matches[4]

          if ($major -gt 255 -or $minor -gt 255) {
            throw "MSI major and minor versions must each be 255 or lower."
          }

          if ($revision -gt 999) {
            throw "Revision must be between 0 and 999."
          }

          $msiBuild = $build * 1000 + $revision

          if ($msiBuild -gt 65535) {
            throw "Encoded MSI build number exceeds 65535."
          }

          $msiVersion = "$major.$minor.$msiBuild"
          "MSI_VERSION=$msiVersion" >> $env:GITHUB_ENV

          Write-Host "Git tag: $tag"
          Write-Host "MSI version: $msiVersion"

      - name: Generate WiX File Components
        shell: pwsh
        run: |
          $releaseDir = (Resolve-Path ".\commet\build\windows\x64\runner\Release").Path
          $installerDir = ".\commet\windows\installer"
          $generator = Join-Path $installerDir "GenerateFiles.ps1"
          $generated = Join-Path $installerDir "GeneratedFiles.wxs"

          if (-not (Test-Path $generator)) {
            throw "WiX generator not found: $generator"
          }

          & $generator -SourceDir $releaseDir -OutputFile $generated

          if (-not (Test-Path $generated)) {
            throw "GeneratedFiles.wxs was not created."
          }

      - name: Build MSI Installer
        shell: pwsh
        run: |
          $project = ".\commet\windows\installer\Installer.wixproj"
          $installerDir = ".\commet\windows\installer"

          # Avoid accidentally collecting an MSI from an earlier build.
          if (Test-Path (Join-Path $installerDir "bin")) {
            Remove-Item (Join-Path $installerDir "bin") -Recurse -Force
          }

          dotnet build $project `
            --configuration Release `
            "-p:ProductVersion=$env:MSI_VERSION"

          $msiPath = ".\commet\windows\installer\bin\x64\Release\commet-windows.msi"

          if (-not (Test-Path $msiPath)) {
            throw "MSI was not created at expected path: $msiPath"
          }

          Copy-Item $msiPath ".\commet-windows.msi" -Force

      - name: Validate MSI contents
        shell: pwsh
        run: |
          $msiPath = (Resolve-Path ".\\commet-windows.msi").Path
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msiPath, 0)
          $view = $database.OpenView('SELECT `FileName` FROM `File`')
          $view.Execute()

          $fileCount = 0
          $hasApplication = $false
          while ($record = $view.Fetch()) {
            $fileCount++
            $fileName = [string]$record.StringData(1)
            if ($fileName -match '(?i)commet\.exe$') {
              $hasApplication = $true
            }
          }
          $view.Close()

          Write-Host "MSI File table entries: $fileCount"
          if ($fileCount -eq 0) {
            throw "The MSI File table is empty; refusing to publish an installer with no payload files."
          }
          if (-not $hasApplication) {
            throw "The MSI does not contain commet.exe; refusing to publish an incomplete installer."
          }

          $mediaView = $database.OpenView('SELECT `Cabinet` FROM `Media`')
          $mediaView.Execute()
          $embeddedCabinet = $false
          while ($mediaRecord = $mediaView.Fetch()) {
            $cabinet = [string]$mediaRecord.StringData(1)
            Write-Host "MSI cabinet entry: $cabinet"
            if ($cabinet.StartsWith('#')) {
              $embeddedCabinet = $true
            }
          }
          $mediaView.Close()
          if (-not $embeddedCabinet) {
            throw "The MSI does not reference an embedded cabinet. Check that MediaTemplate EmbedCab=yes is applied."
          }

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: commet-windows.msi
          path: |
            .\commet-windows.msi
          retention-days: 1
          overwrite: true

  build-android:
    runs-on: ubuntu-latest
    steps:
      # we were having issues running out of disk space on workers, so...
      - name: Aggressive cleanup
        run: |
          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet
  
          # Remove Haskell (GHC)
          sudo rm -rf /usr/local/.ghcup
  
          # Remove Julia
          sudo rm -rf /usr/local/julia*
  
          # Remove Chromium (optional if not using for browser tests)
          sudo rm -rf /usr/local/share/chromium
  
          # Remove Microsoft/Edge and Google Chrome builds
          sudo rm -rf /opt/microsoft /opt/google
  
          # Remove Azure CLI
          sudo rm -rf /opt/az
  
          # Remove CodeQL and other toolcaches
          sudo rm -rf /opt/hostedtoolcache
  
          docker system prune -af || true
          docker builder prune -af || true
          df -h
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
        
      - name: Setup Flutter 
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 17

      - name: Bypass degraded Ubuntu mirror
        run: |
          grep -Eq '^https://archive\.ubuntu\.com/ubuntu/([[:space:]]|$)' /etc/apt/apt-mirrors.txt
          sudo sed -i -E '\@^https?://azure\.archive\.ubuntu\.com/ubuntu/([[:space:]]|$)@d' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt

      - name: Setup Tools
        timeout-minutes: 5
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv ffmpeg
        
      - name: Code Generation
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart

      - name: Setup Signatures
        run: |
          cd $PROJECT_PATH
          dart run scripts/setup_android_release.dart --key_password ${{ secrets.ANDROID_KEY_PASSWORD_BETA }} --key_b64 ${{ secrets.ANDROID_KEY_STORE_B64_BETA }}
          
      - name: Build APK
        run: |
          cd $PROJECT_PATH
          dart run scripts/build_release.dart --platform android --version_tag 'v0.0.0-artifact' --git_hash ${{ github.sha }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: commet-android-beta.apk
          path: commet/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
          overwrite: true

  build-android-google-services:
    runs-on: ubuntu-latest
    steps:
      # we were having issues running out of disk space on workers, so...
      - name: Aggressive cleanup
        run: |
          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet
  
          # Remove Haskell (GHC)
          sudo rm -rf /usr/local/.ghcup
  
          # Remove Julia
          sudo rm -rf /usr/local/julia*
  
          # Remove Chromium (optional if not using for browser tests)
          sudo rm -rf /usr/local/share/chromium
  
          # Remove Microsoft/Edge and Google Chrome builds
          sudo rm -rf /opt/microsoft /opt/google
  
          # Remove Azure CLI
          sudo rm -rf /opt/az
  
          # Remove CodeQL and other toolcaches
          sudo rm -rf /opt/hostedtoolcache
  
          docker system prune -af || true
          docker builder prune -af || true
          df -h
      
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
        
      - name: Setup Flutter 
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 17

      - name: Bypass degraded Ubuntu mirror
        run: |
          grep -Eq '^https://archive\.ubuntu\.com/ubuntu/([[:space:]]|$)' /etc/apt/apt-mirrors.txt
          sudo sed -i -E '\@^https?://azure\.archive\.ubuntu\.com/ubuntu/([[:space:]]|$)@d' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt

      - name: Setup Tools
        timeout-minutes: 5
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv ffmpeg
        
      - name: Code Generation
        run: |
          cd $PROJECT_PATH
          git apply scripts/apply_google_services.patch
          dart run scripts/codegen.dart

      - name: Setup Signatures
        run: |
          cd $PROJECT_PATH
          dart run scripts/setup_android_release.dart --key_password ${{ secrets.ANDROID_KEY_PASSWORD_BETA }} --key_b64 ${{ secrets.ANDROID_KEY_STORE_B64_BETA }}
          
      - name: Build APK
        run: |
          cd $PROJECT_PATH
          dart run scripts/build_release.dart --platform android --version_tag 'v0.0.0-artifact' --git_hash ${{ github.sha }} --enable_google_services true --build_detail google_services

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: commet-android-google-services-beta.apk
          path: commet/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
          overwrite: true

  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - name: Aggressive cleanup
        run: |
          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet
  
          # Remove Haskell (GHC)
          sudo rm -rf /usr/local/.ghcup
  
          # Remove Julia
          sudo rm -rf /usr/local/julia*
  
          # Remove Chromium (optional if not using for browser tests)
          sudo rm -rf /usr/local/share/chromium
  
          # Remove Microsoft/Edge and Google Chrome builds
          sudo rm -rf /opt/microsoft /opt/google
  
          # Remove Azure CLI
          sudo rm -rf /opt/az
  
          # Remove CodeQL and other toolcaches
          sudo rm -rf /opt/hostedtoolcache
  
          docker system prune -af || true
          docker builder prune -af || true
          df -h
      
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true

      - name: Setup Flutter 
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Bypass degraded Ubuntu mirror
        run: |
          grep -Eq '^https://archive\.ubuntu\.com/ubuntu/([[:space:]]|$)' /etc/apt/apt-mirrors.txt
          sudo sed -i -E '\@^https?://azure\.archive\.ubuntu\.com/ubuntu/([[:space:]]|$)@d' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt

      - name: Setup Tools
        timeout-minutes: 5
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv ffmpeg libmimalloc-dev flatpak-builder flatpak webkit2gtk-4.1 keybinder-3.0 libayatana-appindicator3-dev libayatana-ido3-dev
        
      - name: Code Generation
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart
          
      - name: Build Linux
        run: |
          cd $PROJECT_PATH
          dart run scripts/build_release.dart --platform linux --version_tag 'v0.0.0-artifact' --git_hash ${{ github.sha }} --build_detail flatpak

      - name: Create Flatpak
        run: | 
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//51 org.gnome.Sdk//51
          mkdir -p commet/linux/flatpak/commet
          cp -r $PROJECT_PATH/build/linux/x64/release/bundle $PROJECT_PATH/linux/flatpak/commet/bundle
          version=$(echo 'v0.0.0-artifact' | grep -oP '[0-9]+([.][0-9]+)+')
          echo $version
          cd $PROJECT_PATH/linux/flatpak
          sed -i "s/{{VERSION_TAG}}/$version/g" ./chat.commet.commetapp.desktop
          sed -i "s/{{VERSION_TAG}}/$version/g" ./chat.commet.commetapp.metainfo.xml
          flatpak-builder --force-clean build-dir chat.commet.commetapp.yaml --repo=repo
          flatpak build-bundle repo chat.commet.commetapp.flatpak chat.commet.commetapp

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat.commet.commetapp.flatpak
          path: commet/linux/flatpak/chat.commet.commetapp.flatpak
          retention-days: 1
          overwrite: true

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true

      - name: Setup Flutter 
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Bypass degraded Ubuntu mirror
        run: |
          grep -Eq '^https://archive\.ubuntu\.com/ubuntu/([[:space:]]|$)' /etc/apt/apt-mirrors.txt
          sudo sed -i -E '\@^https?://azure\.archive\.ubuntu\.com/ubuntu/([[:space:]]|$)@d' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt

      - name: Setup Tools
        timeout-minutes: 5
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv ffmpeg webkit2gtk-4.1 
        
      - name: Code Generation
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart
      
      - uses: moonrepo/setup-rust@v1
      - run: rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu
      
      - name: Prepare web
        run: |
          cd $PROJECT_PATH
          ./scripts/prepare-web.sh

      - name: Build Web
        run: |
          cd $PROJECT_PATH
          dart run scripts/build_release.dart --platform web --version_tag 'v0.0.0-artifact' --git_hash ${{ github.sha }}
      
      - name: Create archive
        run: |
          cd $PROJECT_PATH/build
          tar -czf commet-web.tar.gz web

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: commet-web.tar.gz
          path: commet/build/commet-web.tar.gz
          retention-days: 1
          overwrite: true
