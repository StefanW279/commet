  <title>commet</title>
  <link rel="manifest" href="manifest.json">

  <script>
    window.commetWebPushPermission = "default";

    window.commetWebPushInit = async function (server) {
      if (!("serviceWorker" in navigator)) {
        throw new Error("Service workers are not supported");
      }

      if (!("PushManager" in window)) {
        throw new Error("Push API is not supported");
      }

      await navigator.serviceWorker.register(
        "/service_worker.js",
        { scope: "/" }
      );

      window.commetWebPushPermission =
        Notification.permission;

      return true;
    };

    function urlBase64ToUint8Array(base64String) {
      const padding =
        "=".repeat((4 - base64String.length % 4) % 4);

      const base64 =
        (base64String + padding)
          .replace(/-/g, "+")
          .replace(/_/g, "/");

      const rawData = window.atob(base64);

      const outputArray =
        new Uint8Array(rawData.length);

      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] =
          rawData.charCodeAt(i);
      }

      return outputArray;
    }

    async function getVapidKey(server) {
      const response =
        await fetch(server + "/api/webpush/config");

      if (!response.ok) {
        throw new Error(
          "Unable to get Web Push configuration"
        );
      }

      return await response.json();
    }

    async function getRegistration() {
      return await navigator.serviceWorker.ready;
    }

    async function getExistingSubscription() {
      const registration =
        await getRegistration();

      return await registration.pushManager
        .getSubscription();
    }

    async function serializeSubscription(subscription) {
      return {
        endpoint: subscription.endpoint,
        keys: {
          p256dh: arrayBufferToBase64Url(
            subscription.getKey("p256dh")
          ),
          auth: arrayBufferToBase64Url(
            subscription.getKey("auth")
          )
        }
      };
    }

    function arrayBufferToBase64Url(buffer) {
      const bytes =
        new Uint8Array(buffer);

      let binary = "";

      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }

      return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }

    async function registerWithServer(
      server,
      subscription
    ) {
      const serialized =
        await serializeSubscription(
          subscription
        );

      const response = await fetch(
        server + "/api/webpush/register",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify(
            serialized
          )
        }
      );

      if (!response.ok) {
        throw new Error(
          "Unable to register Web Push subscription"
        );
      }

      return await response.json();
    }

    window.commetWebPushGetExisting =
      async function (server) {
        const subscription =
          await getExistingSubscription();

        if (!subscription) {
          return null;
        }

        const result =
          await registerWithServer(
            server,
            subscription
          );

        return JSON.stringify({
          pushkey: result.pushkey
        });
      };

    window.commetWebPushSubscribe =
      async function (server) {
        if (!("Notification" in window)) {
          throw new Error(
            "Notifications are not supported"
          );
        }

        const permission =
          await Notification.requestPermission();

        window.commetWebPushPermission =
          permission;

        if (permission !== "granted") {
          return null;
        }

        const vapid =
          await getVapidKey(server);

        const registration =
          await getRegistration();

        let subscription =
          await registration.pushManager
            .getSubscription();

        if (!subscription) {
          subscription =
            await registration.pushManager
              .subscribe({
                userVisibleOnly: true,
                applicationServerKey:
                  urlBase64ToUint8Array(
                    vapid.publicKey
                  )
              });
        }

        const result =
          await registerWithServer(
            server,
            subscription
          );

        return JSON.stringify({
          pushkey: result.pushkey
        });
      };
  </script>

  <script>

  </script>

    }

    .stretch {

    }

    }

    .bottom {

      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

<body>
  <picture id="splash">
    <source
      srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x"
      media="(prefers-color-scheme: light)">
    <source
      srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x"
      media="(prefers-color-scheme: dark)">
    <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>


  <script>
    window.addEventListener('load', function (ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
